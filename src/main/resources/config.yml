# MinecraftAI CONFIGURATION
#
# HELP:
# & for color and special symbols
# %name% for the name of AI
# %prefix% for the configured message prefix
# %response% for the AI response
# %seconds% for the remaining cooldown in seconds
# %status% for the current AI status
# %mode% for the current AI mode

# Config Version
# DON'T CHANGE THIS!!!
config-version: 1

# Prefix
prefix: "&b%name% &7» "

# AI Name
name: "James"

# AI Model
ai:
  # DON'T CHANGE MODEL IF YOU DON'T KNOW WHAT YOU DO
  model: "gemini-3.5-flash-lite"
  # Follow the instructions to get your API_KEY:
  # https://github.com/Kylan1940/MinecraftAI/wiki/How-to-Create-API_KEY
  API_KEY: "YOUR_GEMINI_API_KEY"
  # Maximum AI response length
  max-response-length: 500
  # Cooldown between AI requests
  cooldown: 3
  # History Limit
  conversation:
    max-messages: 20
  # Allow AI to execute commands
  commands:
    # If true, AI can execute commands. If false, AI can't execute comamnds.
    enabled: true
    # Which commands can AI execute. You must enable AI commands execute.
    allowed:
      - tp
      - give
      - kill
      - weather
      - time
      - healall
      - feedall
      - heal
      - feed


message:
  ai-enabled: "%prefix%&aAI mode enabled."
  ai-disabled: "%prefix%&cAI mode disabled."
  already-enabled: "%prefix%&eAI is already enabled."
  already-disabled: "%prefix%&eAI is already disabled."
  player-only: "%prefix%&cThis command can only be used by players."
  usage: "%prefix%&7Use: &f/ai <start|stop|status|mode|clear>"
  status: "%prefix%&7Status: %status% &8| &7Mode: %mode%"
  mode-usage: "%prefix%&7Use: &f/ai mode <public|mention|private>"
  invalid-mode: "%prefix%&cInvalid mode. Available: public, mention, private."
  mode-changed: "%prefix%&aAI mode changed to &e%mode%&a."
  conversation-cleared: "%prefix%&aYour conversation history has been cleared."
  unknown-command: "%prefix%&cUnknown subcommand."
  thinking: "%prefix%&7Thinking..."
  no-api-key: "%prefix%&cAPI key has not been configured."
  cooldown: "%prefix%&cPlease wait &e%seconds% seconds&c."
  error: "%prefix%&cAI Failed to get a response from AI."
  response: "%prefix%&f%response%"

  command-disabled: "%prefix%&cAI commands are disabled."
  command-no-permission: "%prefix%&cYou don't have permission to use AI commands."
  command-not-allowed: "%prefix%&cThat command is not allowed."
  command-invalid: "%prefix%&cThe AI generated an invalid command."
  command-failed: "%prefix%&cThe command could not be executed."
