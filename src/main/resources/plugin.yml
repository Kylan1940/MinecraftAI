name: MinecraftAI
version: 'DEV-0.1'
main: org.kylan1940.minecraftai.MinecraftAI
api-version: '1.21'
author: Kylan1940

commands:
  ai:
    description: Control MinecraftAI
    usage: /ai <start|stop|status|mode|clear>

permissions:
  minecraftai.command:
    description: Allows the player to use MinecraftAI commands.
    default: true
  minecraftai.execute:
    description: Allows MinecraftAI to execute commands for the player.
    default: op
  minecraftai.npc:
    description: Manage MinecraftAI NPCs
    default: op